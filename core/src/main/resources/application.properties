server.port=8000

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6432/core}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:core}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
